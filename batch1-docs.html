<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بیچ 1 مواد — پختونز آف فیوچر</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1410; --card:#2B1F17; --border:#4A3323; --text:#F7EFE3;
    --muted:#C4AD93; --accent:#B3122B; --accent-2:#D9A93B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font-family:'Noto Nastaliq Urdu','Segoe UI',Tahoma,sans-serif;line-height:1.9;
    user-select:none;-webkit-user-select:none;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 24px;border-bottom:1px solid var(--border);
  }
  .logo{font-weight:800;font-size:15px;color:var(--accent-2);}
  .logout-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 16px;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px;}

  .doc-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
  .doc-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer;
  }
  .doc-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}

  .viewer-shell{
    position:relative;background:#0e0b09;border-radius:16px;overflow:hidden;
    border:1px solid var(--border);padding:16px;text-align:center;
  }
  .page-canvas-wrap{position:relative;display:inline-block;max-width:100%;}
  canvas{max-width:100%;height:auto;border-radius:6px;display:block;}
  .watermark{
    position:absolute;pointer-events:none;color:rgba(255,255,255,0.28);
    font-size:13px;font-weight:700;white-space:nowrap;
    transition:top 3s linear, left 3s linear;
  }
  .page-controls{
    display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;
  }
  .page-controls button{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:10px 20px;border-radius:8px;font-family:inherit;font-size:14px;cursor:pointer;
  }
  .page-controls button:disabled{opacity:0.4;cursor:not-allowed;}
  .page-info{color:var(--muted);font-size:14px;}

  .loading{color:var(--muted);text-align:center;padding:60px 0;}
  .notice{
    margin-top:18px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:16px 18px;font-size:13.5px;color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="logo">پختونز آف فیوچر — بیچ 1 مواد</div>
  <div style="display:flex;gap:10px;">
    <a href="/batch1.html" style="color:var(--muted);text-decoration:none;font-size:13px;align-self:center;">ویڈیوز</a>
    <button class="logout-btn" id="logoutBtn">لاگ آؤٹ</button>
  </div>
</header>

<div class="wrap">
  <div class="doc-list" id="docList"></div>

  <div class="viewer-shell">
    <div class="loading" id="loadingMsg">دستاویز لوڈ ہو رہی ہے...</div>
    <div class="page-canvas-wrap" id="canvasWrap" style="display:none;">
      <canvas id="pdfCanvas"></canvas>
      <div class="watermark" id="watermark"></div>
    </div>
  </div>

  <div class="page-controls" id="pageControls" style="display:none;">
    <button id="prevBtn">◀ پچھلا</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextBtn">اگلا ▶</button>
  </div>

  <div class="notice">
    یہ دستاویزات صرف آپ کی ذاتی رسائی کے لیے ہیں۔ ڈاؤن لوڈ یا اسکرین شاٹ کے ذریعے شیئر کرنا اکاؤنٹ بند ہونے کا سبب بن سکتا ہے۔
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  // ---- EDIT THIS LIST when you upload new PDFs ----
  const DOCS = [
    { title: "نوٹس 1", path: "notes-1.pdf" },
    { title: "نوٹس 2", path: "notes-2.pdf" },
  ];

  let currentEmail = "";
  let currentPdf = null;
  let currentPage = 1;

  const docList = document.getElementById("docList");
  const loadingMsg = document.getElementById("loadingMsg");
  const canvasWrap = document.getElementById("canvasWrap");
  const canvas = document.getElementById("pdfCanvas");
  const ctx = canvas.getContext("2d");
  const watermark = document.getElementById("watermark");
  const pageControls = document.getElementById("pageControls");
  const pageInfo = document.getElementById("pageInfo");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  async function checkSession() {
    try {
      const res = await fetch("/api/session-check");
      const data = await res.json();
      if (!res.ok || !data.ok) {
        window.location.href = "/batch1-login.html";
        return;
      }
      currentEmail = data.email;
      watermark.textContent = currentEmail;
      buildDocList();
      loadDoc(DOCS[0].path);
    } catch (err) {
      window.location.href = "/batch1-login.html";
    }
  }

  function buildDocList() {
    docList.innerHTML = "";
    DOCS.forEach((doc, i) => {
      const btn = document.createElement("button");
      btn.className = "doc-btn" + (i === 0 ? " active" : "");
      btn.textContent = doc.title;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".doc-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadDoc(doc.path);
      });
      docList.appendChild(btn);
    });
  }

  async function loadDoc(path) {
    loadingMsg.style.display = "block";
    loadingMsg.textContent = "دستاویز لوڈ ہو رہی ہے...";
    canvasWrap.style.display = "none";
    pageControls.style.display = "none";

    try {
      const res = await fetch("/api/get-pdf-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "load failed");

      currentPdf = await pdfjsLib.getDocument(data.url).promise;
      currentPage = 1;
      canvasWrap.style.display = "inline-block";
      pageControls.style.display = "flex";
      loadingMsg.style.display = "none";
      renderPage();
    } catch (err) {
      loadingMsg.textContent = "یہ دستاویز لوڈ نہیں ہو سکی۔ دوبارہ کوشش کریں۔";
    }
  }

  async function renderPage() {
    const page = await currentPdf.getPage(currentPage);
    const viewport = page.getViewport({ scale: 1.6 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;

    pageInfo.textContent = `صفحہ ${currentPage} / ${currentPdf.numPages}`;
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= currentPdf.numPages;
  }

  prevBtn.addEventListener("click", () => {
    if (currentPage > 1) { currentPage--; renderPage(); }
  });
  nextBtn.addEventListener("click", () => {
    if (currentPage < currentPdf.numPages) { currentPage++; renderPage(); }
  });

  function moveWatermark() {
    const top = Math.random() * 80 + 5;
    const left = Math.random() * 60 + 5;
    watermark.style.top = top + "%";
    watermark.style.left = left + "%";
  }
  moveWatermark();
  setInterval(moveWatermark, 4000);

  // ---- Deterrents ----
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("dragstart", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    const blocked =
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key.toUpperCase())) ||
      (e.ctrlKey && ["U", "S", "P"].includes(e.key.toUpperCase()));
    if (blocked) e.preventDefault();
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/batch1-login.html";
  });

  checkSession();
</script>
</body>
</html>
