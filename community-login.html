<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمیونٹی لاگ ان — پختونز آف فیوچر</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B2B26; --card:#164039; --border:#2A5C50; --text:#F4F1E8;
    --muted:#9FC5B8; --accent:#F2994A; --accent-2:#F5C24C; --accent-3:#27AE60;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Noto Nastaliq Urdu','Segoe UI',Tahoma,sans-serif;line-height:2;
  }
  .card{
    max-width:420px;width:100%;background:var(--card);border:1px solid var(--border);
    border-top:3px solid var(--accent-2);border-radius:14px;padding:34px 28px;
  }
  h1{font-size:20px;text-align:center;margin-bottom:8px;}
  .sub{color:var(--muted);font-size:13.5px;text-align:center;margin-bottom:26px;}
  .field{margin-bottom:16px;text-align:right;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;
  }
  .field input:focus{outline:none;border-color:var(--accent-2);}
  button{
    width:100%;margin-top:8px;padding:14px;border:none;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#D9740F);color:#0B2B26;
    font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
  }
  button:disabled{opacity:0.6;cursor:not-allowed;}
  .status{margin-top:16px;font-size:13.5px;text-align:center;display:none;}
  .status.err{color:#E4574C;display:block;}
  .switch-link{display:block;text-align:center;margin-top:18px;color:var(--muted);font-size:13px;}
  .switch-link a{color:var(--accent-2);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <h1>کمیونٹی لاگ ان</h1>
    <p class="sub">اپنے ای میل اور پاس ورڈ سے لاگ ان کریں۔</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">ای میل ایڈریس</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">پاس ورڈ</label>
        <input type="password" id="password" required placeholder="آپ کا پاس ورڈ">
      </div>
      <button type="submit" id="loginBtn">لاگ ان کریں</button>
      <div class="status" id="status"></div>
    </form>
    <span class="switch-link">اکاؤنٹ نہیں ہے؟ <a href="community-signup.html">اکاؤنٹ بنائیں</a></span>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vtpzujqbdknziuesavte.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8KekSQKei5CHMdflQFlqng_ynmSdXfz";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "چیک ہو رہا ہے...";
    status.className = "status";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      status.textContent = error.message || "لاگ ان ناکام ہوا۔";
      status.classList.add("err");
      btn.disabled = false;
      btn.textContent = "لاگ ان کریں";
    } else {
      window.location.href = "community.html";
    }
  });
</script>
</body>
</html>
