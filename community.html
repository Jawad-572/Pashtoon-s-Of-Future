<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمیونٹی — پختونز آف فیوچر</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B2B26; --bg-alt:#123832; --card:#164039; --border:#2A5C50; --text:#F4F1E8;
    --muted:#9FC5B8; --accent:#F2994A; --accent-2:#F5C24C; --accent-3:#27AE60;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font-family:'Noto Nastaliq Urdu','Segoe UI',Tahoma,sans-serif;line-height:1.9;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg-alt);
    position:sticky;top:0;z-index:10;
  }
  .logo{font-weight:800;font-size:15px;color:var(--accent-2);}
  .logout-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:8px;font-family:inherit;font-size:12.5px;cursor:pointer;
  }
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 80px;}

  .composer{
    background:var(--card);border:1px solid var(--border);border-top:3px solid var(--accent-2);
    border-radius:14px;padding:18px;margin-bottom:20px;
  }
  .composer textarea{
    width:100%;min-height:70px;padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-family:inherit;font-size:14.5px;resize:vertical;
  }
  .composer textarea:focus{outline:none;border-color:var(--accent-2);}
  .composer button{
    margin-top:10px;padding:11px 22px;border:none;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),#D9740F);color:#0B2B26;
    font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;float:left;
  }
  .composer button:disabled{opacity:0.5;cursor:not-allowed;}

  .post{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:12px;
  }
  .post-author{font-weight:700;font-size:14px;color:var(--accent-2);}
  .post-time{color:var(--muted);font-size:11.5px;margin-right:8px;}
  .post-content{margin-top:8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;}

  .state-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:32px 24px;text-align:center;color:var(--muted);
  }
  .state-box h2{color:var(--text);font-size:18px;margin-bottom:10px;}
  .refresh-note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;}
</style>
</head>
<body>

<header>
  <div class="logo">پختونز آف فیوچر — کمیونٹی</div>
  <button class="logout-btn" id="logoutBtn">لاگ آؤٹ</button>
</header>

<div class="wrap" id="wrap">
  <div class="state-box">لوڈ ہو رہا ہے...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // <-- Same values as community-signup.html / community-login.html
  const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_PUBLISHABLE_KEY";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const wrap = document.getElementById("wrap");
  let currentUser = null;
  let pollTimer = null;

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "community-login.html";
      return;
    }
    currentUser = session.user;

    const { data: profile, error } = await supabase
      .from("profiles")
      .select("community_approved")
      .eq("id", currentUser.id)
      .single();

    if (error || !profile) {
      renderState("پروفائل نہیں ملا", "براہ کرم دوبارہ لاگ ان کریں۔");
      return;
    }

    if (!profile.community_approved) {
      renderState(
        "منظوری کا انتظار ہے",
        "آپ کا اکاؤنٹ بن گیا ہے۔ ایڈمن کی منظوری کے بعد آپ یہاں پوسٹ دیکھ اور لکھ سکیں گے۔"
      );
      return;
    }

    renderBoard();
    loadPosts();
    pollTimer = setInterval(loadPosts, 20000);
  }

  function renderState(title, msg) {
    wrap.innerHTML = `<div class="state-box"><h2>${title}</h2><p>${msg}</p></div>`;
  }

  function renderBoard() {
    wrap.innerHTML = `
      <div class="composer">
        <textarea id="postContent" placeholder="اپنا سوال یا تجربہ شیئر کریں..."></textarea>
        <button id="postBtn">پوسٹ کریں</button>
        <div style="clear:both;"></div>
      </div>
      <div id="postsList"></div>
      <div class="refresh-note">ہر 20 سیکنڈ میں خودکار اپڈیٹ ہوتا ہے</div>
    `;
    document.getElementById("postBtn").addEventListener("click", submitPost);
  }

  async function submitPost() {
    const textarea = document.getElementById("postContent");
    const content = textarea.value.trim();
    if (!content) return;

    const btn = document.getElementById("postBtn");
    btn.disabled = true;
    btn.textContent = "بھیجا جا رہا ہے...";

    const { error } = await supabase.from("community_posts").insert({
      user_id: currentUser.id,
      author_email: currentUser.email,
      content: content,
    });

    btn.disabled = false;
    btn.textContent = "پوسٹ کریں";

    if (!error) {
      textarea.value = "";
      loadPosts();
    } else {
      alert("پوسٹ نہیں ہو سکی: " + error.message);
    }
  }

  async function loadPosts() {
    const { data: posts, error } = await supabase
      .from("community_posts")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(100);

    const list = document.getElementById("postsList");
    if (!list) return;

    if (error) {
      list.innerHTML = `<div class="state-box">پوسٹس لوڈ نہیں ہو سکیں۔</div>`;
      return;
    }
    if (!posts || posts.length === 0) {
      list.innerHTML = `<div class="state-box">ابھی کوئی پوسٹ نہیں۔ پہلی پوسٹ آپ کریں!</div>`;
      return;
    }

    list.innerHTML = posts.map(p => `
      <div class="post">
        <span class="post-author">${escapeHtml(p.author_email)}</span>
        <span class="post-time">${new Date(p.created_at).toLocaleString()}</span>
        <div class="post-content">${escapeHtml(p.content)}</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    if (pollTimer) clearInterval(pollTimer);
    await supabase.auth.signOut();
    window.location.href = "community-login.html";
  });

  init();
</script>
</body>
</html>
